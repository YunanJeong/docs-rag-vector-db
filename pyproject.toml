[project]
name = "rag-poc"
version = "0.1.0"
description = "RAG 파이프라인을 처음부터 만들어보는 PoC. 청킹 → bge-m3 임베딩 → Qdrant 하이브리드 검색"
requires-python = ">=3.11"
dependencies = [
    "FlagEmbedding==1.4.2",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
